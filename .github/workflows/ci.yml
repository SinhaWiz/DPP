name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contracts, shared, backend, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contract tests
        run: npm test
      - name: Contract coverage
        run: npm run coverage
      - name: Shared package
        run: npm run typecheck -w @dpp/shared && npm test -w @dpp/shared
      - name: Backend
        run: npm run typecheck -w @dpp/backend && npm test -w @dpp/backend
      - name: Frontend
        run: npm run typecheck -w @dpp/frontend && npm test -w @dpp/frontend
      - name: Frontend build
        run: npm run build -w @dpp/frontend
      - name: The OpenAPI file is up to date
        run: npm run export:openapi && git diff --exit-code docs/openapi.json

  e2e:
    name: End to end (real browser)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
